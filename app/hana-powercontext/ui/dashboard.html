<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PowerContext 看板</title>
  <!-- Fix-1 (cache busting): every asset this page references carries ?v=<version>.
       Without it a host that caches the ui/ tree serves the previous build forever,
       and a fixed card keeps showing the old failure — which is exactly how a
       "phantom" outage survived several real fixes during the T14 campaign.

       The host controls the cache headers for ui/, so the only lever on this side is
       the URL. A changed query string is a different URL to every cache.

       The literal below is kept equal to manifest.json's "version" and asserted
       against it in lib/selftest.mjs — a mismatch fails the suite. It is a literal
       because the page cannot read the manifest: only ui/ is served to the card, so
       there is no runtime path to the file. -->
  <link rel="stylesheet" href="./assets/dashboard.css?v=1.0.0">
</head>
<body>
  <main class="pc-root" id="root" aria-busy="true">
    <!-- Rendered entirely by ./assets/dashboard.js. Nothing Server-provided is
         ever inserted as HTML; the script builds text nodes. -->
    <div class="pc-status" data-tone="unknown">
      <span class="pc-dot"></span>
      <div class="pc-status-body">
        <div class="pc-headline" id="boot-headline">正在连接…</div>
        <div class="pc-detail"><div id="boot-detail">正在从 App 后端读取状态。</div></div>
      </div>
    </div>
  </main>

  <!-- Startup fallback, in the scaffold's starter shape (create_hana_app.py's
       build_panel_html): a CLASSIC script, declared before any module, that
       catches a failed load and replaces the "正在连接…" skeleton with something
       readable.

       It has to be classic and first. A module script that fails to parse or fetch
       never runs, and an error thrown inside one does not reach a handler declared
       later — so a fallback living in the module tree could not report the module
       tree's own failure. This is the path that matters now: dashboard-page.js is a
       module that statically imports ./sdk.js (the bridge sits next to it in ui/),
       so if that bridge is missing or corrupt, the page would otherwise sit on
       "正在连接…" forever. -->
  <script>
    window.addEventListener('error', function () {
      // Only speak while the card has not booted. The scaffold's starter fires this
      // on ANY error event (capture phase, so it also sees resource failures), and
      // copied literally it would let an unrelated late error — a failed icon, a
      // stylesheet — overwrite the status of a perfectly working card. Before boot
      // the message is the whole point; after boot it would be a lie.
      if (window.__pcCardBooted) return;
      var headline = document.getElementById('boot-headline');
      if (headline) headline.textContent = '卡片脚本未能启动';
      var detail = document.getElementById('boot-detail');
      if (detail) detail.textContent = '检查 App 资源；重开卡片或重载 App。';
    }, true);
  </script>

  <!-- View logic and transport stay CLASSIC scripts on purpose: both publish a
       global (PowerContextDashboard / PowerContextDashboardFetch), and classic
       scripts are executed in document order before any module runs, which is what
       makes the globals reliably available to the module below. Making them modules
       would not add anything — neither imports anything — and would put their
       execution after this point in the defer queue.

       dashboard-fetch.js owns the credential door (BUG-3); dashboard.js stays pure
       so both can be asserted without a DOM. -->
  <script src="./assets/dashboard.js?v=1.0.0"></script>
  <script src="./assets/dashboard-fetch.js?v=1.0.0"></script>

  <!-- The wiring is a MODULE because it must import the hana browser bridge.
       `sdk.js` is an ES module (package/dist/ui.js): a classic <script src> would
       be a syntax error, and without this import there is no globalThis.hana at all
       — hana.api.fetch, hana.state and hana.lifecycle all silently vanish, which is
       exactly the BUG-3/BUG-4 defect. -->
  <script type="module" src="./assets/dashboard-page.js?v=1.0.0"></script>
</body>
</html>
